name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Marketing Site (types + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for migration tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify SQLite migration compatibility
        run: python tests/migrations_test.py
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Run unit tests
        run: node --experimental-strip-types --test tests/inquiry.test.mjs tests/content.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
